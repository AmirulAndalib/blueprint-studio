name: Home Assistant schema drift

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintained-catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Compare fallback catalogs with official Home Assistant sources
        run: python .github/scripts/check_ha_schema_drift.py
